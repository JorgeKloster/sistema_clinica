services:
  backend:
    build: ./go-backend
    container_name: clinicSystem-backend
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET}
      CLINIC_TIMEZONE: America/Sao_Paulo
    depends_on: [ db ]
    restart: unless-stopped
    profiles: [ "prod" ]

  backend-local:
    build: ./go-backend
    container_name: clinicSystem-backend
    environment:
      DB_HOST: db-local
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET}
      CLINIC_TIMEZONE: America/Sao_Paulo
    ports:
      - "8080:8080"
    depends_on:
      - db-local
    profiles: [ "dev" ]

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DB_VOLUME}
    restart: unless-stopped
    profiles: [ "prod" ]

  db-local:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ${DB_VOLUME}
    profiles: [ "dev" ]

  migrate:
    image: migrate/migrate
    command: [ "-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable", "up" ]
    volumes:
      - ./go-backend/migrations:/migrations
    depends_on:
      - db
    profiles: [ "prod" ]

  migrate-local:
    image: migrate/migrate
    command: [ "-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-local:5432/${POSTGRES_DB}?sslmode=disable", "up" ]
    volumes:
      - ./go-backend/migrations:/migrations
    depends_on:
      - db-local
    profiles: [ "dev" ]

  web:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web:/srv:ro
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [ backend ]
    restart: unless-stopped
    profiles: [ "prod" ]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
